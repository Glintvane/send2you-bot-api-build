name: Build official Telegram Bot API 10.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
      TDLIB_COMMIT: bc9c263e2bfee06aaab41e82db51a103376030bc
    steps:
      - name: Compile pinned official source; no credentials needed
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build clang gperf libssl-dev zlib1g-dev
          git init upstream
          git -C upstream remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          git -C upstream submodule update --init --recursive --depth 1
          test "$(git -C upstream/td rev-parse HEAD)" = "$TDLIB_COMMIT"
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          cmake --build build --target telegram-bot-api --parallel 2
          mkdir artifact
          cp build/telegram-bot-api artifact/telegram-bot-api
          strip --strip-unneeded artifact/telegram-bot-api
          cp upstream/LICENSE_1_0.txt artifact/LICENSE_1_0.txt
          artifact/telegram-bot-api --version
          ldd artifact/telegram-bot-api | tee artifact/DYNAMIC-DEPS.txt
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          version = subprocess.check_output(['artifact/telegram-bot-api','--version'], stderr=subprocess.STDOUT, text=True).strip()
          assert '10.3' in version, version
          info = dict(source_url='https://github.com/tdlib/telegram-bot-api',
              source_commit=os.environ['UPSTREAM_COMMIT'], tdlib_commit=os.environ['TDLIB_COMMIT'],
              bot_api_version='10.3', version_output=version, architecture='x86_64',
              build_os='ubuntu-24.04', libc=platform.libc_ver(),
              binary_bytes=pathlib.Path('artifact/telegram-bot-api').stat().st_size,
              repository=os.environ['GITHUB_REPOSITORY'], run_id=os.environ['GITHUB_RUN_ID'],
              workflow_commit=os.environ['GITHUB_SHA'], license='BSL-1.0')
          pathlib.Path('artifact/BUILD.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
          cd artifact
          sha256sum telegram-bot-api BUILD.json LICENSE_1_0.txt DYNAMIC-DEPS.txt > SHA256SUMS
          cat BUILD.json
          cat SHA256SUMS
      - name: Publish small binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned
        with:
          name: telegram-bot-api-10.3-linux-amd64
          path: artifact/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
